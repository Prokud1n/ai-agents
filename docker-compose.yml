name: ai-agents

# Only app and postgres are published, and only on 127.0.0.1; everything else is reachable
# inside the compose network only.

x-app-image: &app-image
  image: ai-agents-app:local
  env_file: .env

services:
  # The image is built once, here; app runs the same image (it depends on migrate, so the
  # image is always built before app starts).
  migrate:
    <<: *app-image
    build: .
    pull_policy: build
    entrypoint: ["/app/migrate"]
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    # On SIGTERM migrate finishes the migration in progress and exits. It is not interrupted only
    # within stop_grace_period (5m): after that docker sends SIGKILL and the database may stay dirty.
    stop_grace_period: 5m

  app:
    <<: *app-image
    # Built by the migrate service; never pulled from a registry.
    pull_policy: never
    # gid of telegram-bot-api in its image: the Bot API server creates downloaded media as 0640 and
    # directories as 0750, so its group can read them. app stays the image's nonroot user and cannot read
    # the server's own files (td.binlog with bot sessions is 0600).
    group_add: ["101"]
    environment:
      # The container healthcheck probes :8080, so the address is fixed inside the container.
      HTTP_ADDRESS: ":8080"
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    volumes:
      # With the local Bot API server (`--local`) getFile returns a path inside this volume.
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 20s
    restart: unless-stopped

  # Edits the editor's videos (cmd/media-worker) on the media image: ffmpeg parses files from users, so it runs in a
  # container of its own, without the bot tokens, the Claude API key or the database (only the variables below, no
  # env_file). Jobs come from the app through Redis, files go through S3. No ports.
  media-worker:
    image: ai-agents-media:local
    build:
      context: .
      target: media
    pull_policy: build
    entrypoint: ["/app/media-worker"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_STOP_TIMEOUT: ${APP_STOP_TIMEOUT:-15s}
      REDIS_ADDRESS: ${REDIS_ADDRESS:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      S3_ENDPOINT: ${S3_ENDPOINT:-s3:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      MEDIA_KEY_PREFIX: ${MEDIA_KEY_PREFIX:-incoming}
      MEDIA_RESULT_PREFIX: ${MEDIA_RESULT_PREFIX:-edits}
      MEDIA_UPLOAD_TIMEOUT: ${MEDIA_UPLOAD_TIMEOUT:-10m}
      # Without the key the worker starts, and every job fails with "editing is not configured".
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ru}
      EDITOR_STREAM: ${EDITOR_STREAM:-editor:jobs}
      MEDIA_WORKER_MAX_SOURCE_DURATION: ${MEDIA_WORKER_MAX_SOURCE_DURATION:-10m}
      MEDIA_WORKER_MAX_SOURCE_SIZE: ${MEDIA_WORKER_MAX_SOURCE_SIZE:-2147483648}
      MEDIA_WORKER_FIT: ${MEDIA_WORKER_FIT:-pad}
      MEDIA_WORKER_MIN_SPEECH_SHARE: ${MEDIA_WORKER_MIN_SPEECH_SHARE:-0.6}
      # One render of a 10-minute source within the job; the job itself is bounded by EDITOR_JOB_TIMEOUT (it comes with the job from the app).
      FFMPEG_TIMEOUT: ${MEDIA_WORKER_FFMPEG_TIMEOUT:-40m}
      SUBTITLES_STYLE_FILE: ${SUBTITLES_STYLE_FILE:-}
      # The root filesystem is read-only: the job files, temporary files and the fontconfig cache go to /work.
      MEDIA_WORKER_DIR: /work
      TMPDIR: /work
      XDG_CACHE_HOME: /work/.cache
    volumes:
      # Named volume: created owned by the image's nonroot user (from /work in the image); each job's directory is
      # removed after it, what a killed job leaves is removed on the next start.
      - media-worker-work:/work
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 2
    mem_limit: 3g
    pids_limit: 256
    depends_on:
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      # Fresh while the worker reaches Redis (a heartbeat file in /work).
      test: ["CMD", "/app/media-worker", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped

  postgres:
    # pgvector/pgvector:0.8.7-pg17
    image: pgvector/pgvector:0.8.7-pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -h forces TCP: during first init the temporary server listens on the unix socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    # redis:7.4.12-alpine
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # S3-compatible storage for media. RustFS instead of MinIO: MinIO archived the community
  # edition and its images are no longer pullable anonymously (Docker Hub / quay.io).
  # The bucket (S3_BUCKET) is created by the app on start.
  s3:
    # rustfs/rustfs:1.0.5
    image: rustfs/rustfs:1.0.5@sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Local Bot API server: lets bots download files up to 2 GB (the public API allows 20 MB).
  # Needs TELEGRAM_API_ID / TELEGRAM_API_HASH from https://my.telegram.org, so it is opt-in:
  #   docker compose --profile telegram up -d
  telegram-bot-api:
    # aiogram/telegram-bot-api:10.4
    image: aiogram/telegram-bot-api:10.4@sha256:ba7493f853b3c3339e6dc2a444d5bcfbe121188b491aabd30857dcd69978430c
    profiles: [telegram]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    healthcheck:
      # The server has no health endpoint; check that the HTTP port accepts connections.
      test: ["CMD", "nc", "-z", "127.0.0.1", "8081"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  s3-data:
  telegram-bot-api-data:
  media-worker-work:
