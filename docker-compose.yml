name: ai-agents

services:
  app:
    build: .
    env_file: .env
    environment:
      # Inside the compose network dependencies are reached by service name;
      # .env keeps localhost values for `make run` on the host.
      HTTP_ADDRESS: ":8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_ADDRESS: redis:6379
      S3_ENDPOINT: s3:9000
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -h forces TCP: during first init the temporary server listens on the unix socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # S3-compatible storage for media. RustFS instead of MinIO: MinIO archived the community
  # edition and its images are no longer pullable anonymously (Docker Hub / quay.io).
  # The bucket (S3_BUCKET) is created by the app on start.
  s3:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_HOST_PORT:-9000}:9000"
      - "${S3_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Local Bot API server: lets bots download files up to 2 GB (the public API allows 20 MB).
  # Needs TELEGRAM_API_ID / TELEGRAM_API_HASH from https://my.telegram.org, so it is opt-in:
  #   docker compose --profile telegram up -d
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: [telegram]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    ports:
      - "${TELEGRAM_BOT_API_HOST_PORT:-8081}:8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  s3-data:
  telegram-bot-api-data:
