# Subtitle style: the built-in default, written out (subtitles.DefaultStyle) — the trainer's own look, measured on the
# reel she edited and published herself (T3.20). Copy this file, change it and pass it as `-style file.yaml` or
# SUBTITLES_STYLE_FILE. base names the built-in style the file starts from: fields left out keep its values (a file
# without base starts from the phrase style, so the files written before keep their look); unknown fields are errors. The other looks are next to this
# file (in the media image: /app/subtitles-style-*.yaml): style-words.yaml — the reference reels of T3.17 (the speech one
# word at a time on a plate, the Instagram handle and the end card), style-phrase.yaml — the phrases with accents and a
# vignette of before.
# Colors: "#RRGGBB" or "#RRGGBBAA" (AA is opacity, FF is opaque). Sizes are pixels of the 1080×1920 frame; a font size
# is the height of a line as libass sets it (Manrope letters are 0.73 of it, Fira Sans Extra Condensed ones 0.83).
# A font is the family name libass matches: for a static weight other than Regular/Bold it is the legacy family with
# the weight ("Manrope Medium"), see `fc-scan --format '%{family}\n' file.ttf` (the last name). The font file goes to
# SUBTITLES_FONTS_DIR (assets/fonts, /app/fonts in the media image).

# trainer | words | phrase.
base: trainer

# The speech: phrases of one or two lines, white Manrope Regular, centered at the top under the top line (its first
# line about 470 px from the top, as in her reel), without accents, plates or a vignette — a light shadow only.
text:
  font: Manrope # the Regular weight (Manrope-Regular.ttf)
  size: 60
  bold: false
  uppercase: false
  color: "#FFFFFF"

layout:
  # phrase: phrases of a few words in lines; word: one word at a time on a plate (style-words.yaml).
  mode: phrase
  # top | middle | bottom. Instagram covers the top 250 px, the bottom 420 px (caption, buttons)
  # and 140 px on the right (buttons): the margins cannot be smaller.
  position: top
  margin_top: 455
  margin_bottom: 440
  margin_side: 140
  max_lines: 2
  # Lines of up to 30 characters (her longest is 28); at most what fits between the margins (width / size /
  # char_width, 32 here).
  max_line_chars: 30
  char_width: 0.41
  # Drop . , : ; at the end of a subtitle; «?», «!» and the punctuation inside stay.
  trim_end_punctuation: true
  # The first word of a sentence with a small letter, as she writes («первое: мои подопечные»); names inside a sentence
  # keep their capital («в Москве»).
  lowercase_sentences: true
  # Fix the frequent misses of the speech recognition: «кто-то», «онлайн-тренировки», «всё равно», «ещё», a capital
  # in the middle of a sentence («спросит Ну тогда поедем» is two sentences). Only in the subtitles.
  orthography: true
  # A subtitle after a pause fades in over this many ms (subtitles that follow each other do not); 0: none.
  fade_in: 200
  # Whole phrases, as she writes them: a subtitle ends at the end of a sentence or at a pause of at least gap seconds;
  # a phrase too long for the lines (or longer than max_duration) is split at a comma or before a conjunction into
  # pieces of at least split_words words; a piece of fewer than min_words words or said in less than min_duration
  # seconds is glued to its neighbor (in its sentence first) when they fit two lines, otherwise it stays on the
  # screen until the next subtitle across a pause up to hold_gap. Lines are cut by sense: not after a preposition, a
  # conjunction or «не», not before «же»/«ли». enabled false: the short pieces of before.
  phrases:
    enabled: true
    gap: 0.25
    min_words: 3
    min_duration: 1.5
    split_words: 4
    hold_gap: 0.8
    max_duration: 5

# No accents: max_per_cue 0 and longest_word false (the look of an accent is kept for an explicit list of accents).
accent:
  font: Fira Sans Extra Condensed ExtraBold
  size: 64
  bold: false
  uppercase: true
  color: "#F2B94B"
  words: []
  max_per_cue: 0
  longest_word: false

outline:
  color: "#000000"
  size: 0
# A light shadow keeps the white readable on a light wall (40 % black, 2 px).
shadow:
  color: "#00000066"
  size: 2

karaoke_color: "#FF8C5A"

vignette:
  enabled: false
  opacity: 0.6
  fade: 320

# The hook title («развеиваю страхи об онлайн-тренировках»): the editor's model proposes it, the trainer changes or
# removes it by a revision. Large peach Fira Sans Extra Condensed ExtraBold capitals, centered, the top of the line at
# margin (her two lines take about 440..620 px), at most max_lines lines wrapped by words; a long hook is made smaller as
# a whole (down to 60 %). While it is shown the phrase subtitles stand under it (gap px lower).
hook:
  font: Fira Sans Extra Condensed ExtraBold
  size: 122
  bold: false
  uppercase: true
  color: "#E8A080" # peach
  # One key word (a number with its word, otherwise the longest word) in this color; "" — none.
  highlight: ""
  # until section: the hook stays until the first section heading, but at least min_duration and at most max_duration
  # seconds (max_duration without headings); until phrase: until half a second after the first phrase.
  until: section
  min_duration: 1.8
  max_duration: 2.5
  # Fade in and out, ms.
  fade: 150
  # Between the hook and the screen notes' subtitles under it, px.
  gap: 24
  # Average character width in font sizes, for the line estimate of a font other than Fira Sans Extra Condensed
  # ExtraBold (its capitals are measured by their advances, so the frame fits the text): 19 characters a line here.
  char_width: 0.41
  box: ""
  box_padding: 12
  shadow:
    color: "#00000066"
    size: 2
  # The top of the hook (0: layout.margin_top) and its side margins (0: layout.margin_side: the hook stands above the
  # Instagram buttons, so it may be wider than the subtitles).
  margin: 410
  margin_side: 60
  max_lines: 3
  # The fewest lines that keep the hook at least this large (percent): a long hook is made smaller as a whole in two
  # lines (her two lines take about 440..620 px) rather than given a third one that reaches the face.
  fit_scale: 75
  # No speech subtitles while the hook is shown (her hook stands alone); a phrase that starts under it is shown from
  # its end.
  hide_subtitles: true
  # A phrase that repeats the hook right after it (at least half of the words, endings aside, within a second after
  # it) is not shown in the subtitles.
  hide_repeat: true
  # select: the hook appears small at the right in a thin white frame with square handles and an arrow cursor, as an
  # object selected in an editor, stands so for about a second, grows to its place and size in 0.28 s slowing down,
  # then the frame and the cursor go; none: it fades in at its place.
  animation: select

# The section headings of a talking head («страх 1», «страх 2»: the editor's model puts them where the trainer goes to
# the next point): the peach capitals of the hook, smaller, one line centered above the subtitles (the top at margin;
# her «СТРАХ 1» is centered at 410 px). A heading waits for the hook to go and stays until the end of the first phrase
# of its section (the question under it), min_duration..max_duration seconds; the phrase that reads it out («страх
# номер один»: it starts within 0.3 s of the heading and ends before min_duration) is not shown in the subtitles; the
# next heading replaces it, a callout replaces it too. enabled false: they are drawn as callouts of the screen notes.
section:
  enabled: true
  font: Fira Sans Extra Condensed ExtraBold
  size: 78
  bold: false
  uppercase: true
  color: "#E8A080"
  margin: 372
  min_duration: 2.5
  max_duration: 6
  fade: 150
  # The question under a heading is shown with its speech, but not before this many seconds after the heading, so the
  # heading is read first (after the editor cut the reading «страх номер один» out of the sound the heading starts on
  # the question); the speech is never delayed more. A pause without text under the heading is a pause in the sound.
  lead: 0.35

# The top line over the whole reel, as the interface of a camera: REELS_TOPBAR_LEFT at the left edge («tg:
# @ana_prokudina») and REELS_TOPBAR_RIGHT at the right one («2x»), small translucent gray Manrope (the right text
# right_size: «2x» is larger in her reel), their middle at y, side px from the edges; a text wider than max_width is
# squeezed. Without the variables nothing is drawn.
topbar:
  enabled: true
  font: Manrope
  size: 44
  bold: false
  uppercase: false
  color: "#FFFFFF8C" # 55 % white
  right_size: 58
  y: 286
  side: 60
  max_width: 440
  char_width: 0.42
  shadow:
    color: "#00000066"
    size: 0

# The trainer's Instagram handle (REELS_HANDLE) with its icon and the end card are not in her reels: off here
# (style-words.yaml draws them). The values are kept for a style that turns them on.
handle:
  enabled: false
  font: Manrope Medium
  size: 32
  bold: false
  uppercase: false
  color: "#FFFFFF"
  right: 40
  y: 0
  max_width: 300
  icon_size: 34
  char_width: 0.55
  shadow:
    color: "#000000BF"
    size: 2.5

end_card:
  font: Manrope Medium
  size: 64
  bold: false
  uppercase: false
  color: "#FFFFFF"
  duration: 2
  shade: 0.7
  fade: 500
  icon_size: 120

# Exercise titles of a workout reel («Выпады — 12 раз»), in the accent font in capitals at the bottom (position empty:
# the edge opposite the subtitles); margin is from that edge. With the box they take 1252..1460 px here.
title:
  font: Fira Sans Extra Condensed ExtraBold
  size: 72
  bold: false
  uppercase: true
  color: "#F2B94B"
  position: ""
  margin: 460
  box: "#000000B3"
  box_padding: 14

# The word layout (layout.mode word, style-words.yaml): unused here, but validated.
word_box:
  font: Manrope Medium
  size: 48
  bold: false
  uppercase: false
  color: "#111111"
  lowercase: true
  box: "#FFFFFF"
  padding: 9
  x: 140
  y: 600
  max_width: 560
  min_duration: 0.15
  char_width: 0.55
