name: CI

# How go.mod/go.sum stay tidy and the PR head is always checked:
# 1. `tidy` runs `go mod tidy`. On a push to feature/**, fix/** or refactoring/** with changes it
#    commits go.mod/go.sum to the branch, then dispatches this workflow on the branch and skips
#    the checks of the current run (they would test a commit that is no longer the branch head).
#    A push made with GITHUB_TOKEN does not trigger workflows; workflow_dispatch does.
#    If the dispatch fails, `tidy` fails with the command to start the run by hand.
# 2. The dispatched run tests the new head: its `check` and `compose-smoke` are attached to that SHA.
# 3. Anywhere else (main, other branches, dispatched runs) an untidy go.mod fails `tidy`,
#    so a commit loop is impossible.
# `check` also requires a branch to contain the current main: rebase on main before merging.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions: {}

# The event name is part of the group so the run dispatched by `tidy` does not cancel the run that
# dispatched it (that run would otherwise end as "cancelled").
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tidy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit go.mod/go.sum to feature branches
      actions: write # dispatch CI on the new commit
    outputs:
      committed: ${{ steps.tidy.outputs.committed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: go mod tidy
        id: tidy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go mod tidy
          if git diff --quiet -- go.mod go.sum; then
            echo "go.mod and go.sum are tidy"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" != "push" ]] ||
            [[ "$GITHUB_REF_NAME" != feature/* && "$GITHUB_REF_NAME" != fix/* && "$GITHUB_REF_NAME" != refactoring/* ]]; then
            git diff -- go.mod go.sum
            echo "::error::go.mod/go.sum are not tidy: run go mod tidy"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "Run go mod tidy"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Committed go mod tidy as $(git rev-parse HEAD); checks run in the dispatched CI run"

          if ! gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"; then
            echo "::error::go mod tidy was committed, but CI could not be started on the new head. Run: gh workflow run ci.yml --ref ${GITHUB_REF_NAME}"
            exit 1
          fi

  check:
    needs: tidy
    if: needs.tidy.outputs.committed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # Full history of the branch: merge-base needs it to find main among the ancestors.
          fetch-depth: 0

      - name: Show tested commit
        run: echo "Testing $(git rev-parse HEAD) (${GITHUB_EVENT_NAME})"

      # main itself is skipped: by the time this runs, main may have moved past the tested commit.
      - name: Require the branch to contain the current main
        if: github.ref != 'refs/heads/main'
        run: |
          # origin/main is already here: checkout with fetch-depth 0 fetches all branches.
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::rebase on main: the branch does not contain origin/main ($(git rev-parse --short origin/main))"
            exit 1
          fi
          echo "The branch contains origin/main ($(git rev-parse --short origin/main))"

      # Merged migrations are immutable, and golang-migrate silently skips a migration whose number is
      # below the latest applied one. So against main a branch may only add .sql migrations, numbered above
      # every migration in main. --no-renames turns a rename into D (old) + A (new), so it is caught too.
      - name: Require new migrations to be numbered above main and merged ones unchanged
        if: github.ref != 'refs/heads/main'
        run: |
          latest=$(git ls-tree --name-only origin/main migrations/ \
            | sed -n 's|^migrations/\([0-9]\{1,\}\)_.*\.sql$|\1|p' | sort -n | tail -n 1)
          latest=$((10#${latest:-0}))
          status=0
          while IFS=$'\t' read -r change file; do
            [[ -n "$file" && "$file" == *.sql ]] || continue
            if [[ "$change" != A ]]; then
              echo "::error file=$file::merged migration changed (git status $change): do not edit, delete or rename merged migrations, add a new one"
              status=1
              continue
            fi
            number=$(basename "$file" | sed -n 's|^\([0-9]\{1,\}\)_.*\.sql$|\1|p')
            if [[ -z "$number" ]]; then
              echo "::error file=$file::migration must be named NNN_description.(up|down).sql"
              status=1
            elif (( 10#$number <= latest )); then
              echo "::error file=$file::migration number $number must be above the latest in main ($latest): renumber it"
              status=1
            fi
          done < <(git diff --no-renames --name-status origin/main -- migrations/)
          if (( status == 0 )); then
            echo "Migrations: merged ones unchanged, new ones numbered above main ($latest)"
          fi
          exit "$status"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Lint
        run: make lint

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -hide_banner -version | sed -n 1p

      - name: Test
        env:
          FFMPEG_TESTS_REQUIRED: "1" # ffmpeg tests fail instead of skipping
        run: make test

      - name: Show ffmpeg integration tests
        env:
          FFMPEG_TESTS_REQUIRED: "1"
        run: |
          go test -count=1 -v -run 'TestRunner' ./internal/providers/ffmpeg/
          go test -count=1 -v -run 'TestRender' ./internal/roughcut/
          go test -count=1 -v -run 'TestBurnSubtitlesWithFFmpeg' ./internal/subtitles/

      # The editor's limits (a job waits in the queue, then runs its timeout from the start; no worker → a technical
      # failure) and the environment ffmpeg gets: shown verbosely, they are the proof of the review's points.
      - name: Show editor tests
        run: |
          go test -count=1 -v -run 'TestExecutor|TestFailureText' ./internal/editor/
          go test -count=1 -v -run 'TestWorker|TestPipelineToneMapsHDR' ./internal/mediaworker/
          go test -count=1 -v -run 'TestChildEnv|TestMediaInfoHDR' ./internal/providers/ffmpeg/

      # Hostile input for kb: PDFs are parsed in real child processes (the test binary re-run as the
      # parser), symlinks inside KB_ROOT lead outside it. The log shows each attack failing as an ordinary
      # error while the parent test process survives.
      - name: Show hostile input tests
        run: >-
          go test -race -count=1 -v
          -run 'TestHostilePDF|TestPDFWorker|TestRunnerIngestHostilePDF|TestRunnerIngestSymlinkOutsideRoot|TestCollectFiles|TestReadFileLimited'
          ./internal/knowledge/extract/ ./internal/kbcli/

  compose-smoke:
    needs: tidy
    if: needs.tidy.outputs.committed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Show tested commit
        run: echo "Testing $(git rev-parse HEAD) (${GITHUB_EVENT_NAME})"

      - name: Prepare env
        run: cp .env.dist .env

      - name: Validate compose with the telegram profile
        run: docker compose --profile telegram config -q

      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Check readiness
        run: curl -fsS http://127.0.0.1:8080/readyz

      - name: Check liveness
        run: curl -fsS http://127.0.0.1:8080/healthz

      # Integration tests run against the compose stack: one pinned PostgreSQL, migrated by "migrate".
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # The pipeline of the media worker (TestIntegrationPipeline) renders with the runner's ffmpeg and libass; it runs
      # against the ffmpeg of the media image too (job media-image).
      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -hide_banner -version | sed -n 1p

      - name: Integration tests
        run: make test-integration

      # The media worker runs apart from the app: healthy, as the image's nonroot user, with a read-only root, no
      # capabilities, no new privileges, and only the allowed variables (an allowlist: anything new in its environment
      # must be added here on purpose).
      - name: Check the media worker container
        shell: bash
        run: |
          set -euo pipefail
          id=$(docker compose ps -q media-worker)
          docker compose ps media-worker
          fail() { echo "::error::$*"; exit 1; }
          [[ "$(docker inspect -f '{{.State.Health.Status}}' "$id")" == healthy ]] || fail "media-worker is not healthy"
          [[ "$(docker compose exec -T media-worker id -u)" == 65532 ]] || fail "media-worker must run as nonroot"
          [[ "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$id")" == true ]] || fail "the root filesystem must be read-only"
          docker inspect -f '{{json .HostConfig.CapDrop}}' "$id" | grep -q '"ALL"' || fail "CapDrop must contain ALL"
          docker inspect -f '{{json .HostConfig.SecurityOpt}}' "$id" | grep -q 'no-new-privileges' \
            || fail "SecurityOpt must contain no-new-privileges"
          allowed=(PATH HOSTNAME HOME TERM SUBTITLES_FONTS_DIR
            LOG_LEVEL APP_STOP_TIMEOUT REDIS_ADDRESS REDIS_PASSWORD REDIS_DB
            S3_ENDPOINT S3_ACCESS_KEY S3_SECRET_KEY S3_BUCKET S3_REGION S3_USE_SSL
            MEDIA_KEY_PREFIX MEDIA_RESULT_PREFIX MEDIA_UPLOAD_TIMEOUT OPENAI_API_KEY OPENAI_BASE_URL WHISPER_LANGUAGE
            EDITOR_STREAM MEDIA_WORKER_MAX_SOURCE_DURATION MEDIA_WORKER_MAX_SOURCE_SIZE MEDIA_WORKER_FIT
            MEDIA_WORKER_MIN_SPEECH_SHARE MEDIA_WORKER_LOUDNESS MEDIA_WORKER_DENOISE MEDIA_WORKER_ZOOM FFMPEG_TIMEOUT
            SUBTITLES_STYLE_FILE MEDIA_WORKER_DIR TMPDIR XDG_CACHE_HOME)
          docker compose exec -T media-worker env | cut -d= -f1 | sort -u > env-keys.txt
          echo "media-worker environment: $(tr '\n' ' ' < env-keys.txt)"
          extra=$(grep -vxF -f <(printf '%s\n' "${allowed[@]}") env-keys.txt || true)
          [[ -z "$extra" ]] || fail "media-worker has variables outside the allowlist: $extra"
          docker compose logs --no-log-prefix media-worker | grep -q '"msg":"mediaworker: started"'
          echo "media-worker: healthy, nonroot, read-only, no capabilities, only allowed variables"

      - name: Check that only app and postgres are published, on 127.0.0.1
        run: |
          docker ps --filter label=com.docker.compose.project=ai-agents \
            --format '{{.Label "com.docker.compose.service"}} {{.Ports}}' | tee ports.txt
          if grep -E '0\.0\.0\.0:|\[::\]:|:::' ports.txt; then
            echo "::error::ports must be published on 127.0.0.1 only"
            exit 1
          fi
          if grep -E '^(redis|s3|telegram-bot-api|media-worker) .*->' ports.txt; then
            echo "::error::internal services must not be published"
            exit 1
          fi

      # migrate up already ran on start (the migrate service); then roll back one, re-apply, and
      # require every run to finish with a clean (not dirty) state.
      - name: Migrate up (on start), down, up
        shell: bash
        run: |
          docker compose logs --no-log-prefix migrate 2>&1 | tee migrate.log
          make migrate-down 2>&1 | tee -a migrate.log
          make migrate 2>&1 | tee -a migrate.log

          grep '"msg":"migrator: done"' migrate.log > done.log || true
          echo "--- migrator results:"
          cat done.log
          if [[ "$(grep -c '"dirty":false' done.log)" != 3 ]] || [[ "$(wc -l < done.log)" != 3 ]]; then
            echo "::error::expected 3 migrate runs (up, down, up) with dirty:false"
            exit 1
          fi

      - name: Check migrations state
        shell: bash
        run: |
          latest="$(ls migrations/*.up.sql | sed -E 's|.*/0*([0-9]+)_.*|\1|' | sort -n | tail -1)"
          state="$(docker compose exec -T postgres sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -c "SELECT version, dirty FROM schema_migrations"')"
          echo "schema_migrations: ${state} (latest migration: ${latest})"
          if [[ "$state" != "${latest}|f" ]]; then
            echo "::error::expected schema_migrations ${latest}|f, got ${state}"
            exit 1
          fi

      - name: Shellcheck scripts
        run: shellcheck --version | sed -n 2p && shellcheck -x scripts/m0-check.sh scripts/kb.sh

      # make kb-* turns a host path inside ./kb into a path under /kb in the container; anything outside fails.
      - name: Knowledge base paths (scripts/kb.sh)
        shell: bash
        run: |
          status=0
          check() { # check <path> <expected container path, or "-" for an error>
            local got code=0
            got=$(scripts/kb.sh container-path "$1" 2>err.txt) || code=$?
            if [[ $2 == - ]]; then
              if [[ $code -ne 2 ]] || ! grep -q 'вне папки базы знаний' err.txt; then
                echo "::error::kb path '$1': expected the outside-of-./kb error, got '$got' (exit $code)"; status=1
              fi
            elif [[ $code -ne 0 || $got != "$2" ]]; then
              echo "::error::kb path '$1': expected '$2', got '$got' (exit $code): $(cat err.txt)"; status=1
            fi
          }
          check ./kb /kb
          check kb /kb
          check ./kb/ /kb
          check ./kb/brand /kb/brand
          check kb/brand/voice.md /kb/brand/voice.md
          check ./kb/./brand//voice.md /kb/brand/voice.md
          check ./kb/x/../brand /kb/brand
          check "$PWD/kb/brand" /kb/brand
          check "./kb/with space/a.md" "/kb/with space/a.md"
          check ./kb/.. -
          check ./kb/../.env -
          check ../kb -
          check ./kbx -
          check ./internal -
          check /etc/passwd -
          for bad in -kind $'./kb/a\nb'; do
            if scripts/kb.sh container-path "$bad" 2>err.txt; then
              echo "::error::kb path '$bad' must be rejected"; status=1
            fi
            cat err.txt
          done
          exit "$status"

      # kb in the app image without OPENAI_API_KEY. extract-pdf runs directly (as the image's nonroot and as
      # the runner's uid): it must parse a PDF and set its limits (otherwise it warns on stderr). Then make
      # kb-ingest runs the whole chain in compose: /app/kb starts its own extract-pdf child for each PDF in
      # distroless, the crashing PDF fails alone, the owner-only (600) file is read, and every readable file
      # reaches the embeddings step, which fails without the key (so nothing is written).
      - name: Knowledge base CLI in the image
        shell: bash
        run: |
          set +e
          image=ai-agents-app:local
          fail() { echo "::error::$*"; exit 1; }

          docker run --rm --network none --entrypoint /app/kb "$image" > usage.txt 2>&1
          code=$?
          cat usage.txt
          [[ $code -eq 2 ]] && grep -q '^usage:' usage.txt || fail "kb without arguments: expected usage, exit 2 (got $code)"

          for user in "" "$(id -u):$(id -g)"; do
            docker run --rm -i --network none ${user:+--user "$user"} --entrypoint /app/kb "$image" extract-pdf \
              < internal/knowledge/extract/testdata/brand.pdf > worker.json 2> worker.err
            code=$?
            echo "extract-pdf as ${user:-image user}: exit $code, $(jq -r '.text | length' worker.json) characters"
            cat worker.err
            [[ $code -eq 0 ]] || fail "extract-pdf exited with $code"
            jq -e '(.text | length > 0) and (.error == null)' worker.json > /dev/null || fail "extract-pdf returned no text"
            [[ ! -s worker.err ]] || fail "extract-pdf wrote to stderr (limits not applied?)"
          done

          mkdir -p kb/_ci
          cp internal/knowledge/extract/testdata/brand.pdf kb/_ci/brand.pdf
          cp internal/knowledge/extract/testdata/pdf-objstm-self.pdf kb/_ci/crash.pdf
          printf '# Private\n\nOwner-only file.\n' > kb/_ci/private.md
          chmod 644 kb/_ci/brand.pdf kb/_ci/crash.pdf
          chmod 600 kb/_ci/private.md
          ls -ln kb/_ci

          make kb-ingest KB_PATH=./kb/_ci > ingest.out 2> ingest.err
          code=$?
          cat ingest.out
          echo "--- exit $code; stderr:"
          cat ingest.err
          [[ $code -ne 0 ]] || fail "kb-ingest without OPENAI_API_KEY must fail"
          for file in brand.pdf private.md; do
            grep -q "^failed *_ci/$file: failed to ingest document: .*embeddings are not configured" ingest.out \
              || fail "_ci/$file did not reach the embeddings step"
          done
          grep -q '^failed *_ci/crash.pdf: failed to extract text: .*parser crashed' ingest.out \
            || fail "the crashing PDF must fail as a parser crash"

          make kb-ingest KB_PATH=./internal > outside.out 2>&1
          code=$?
          cat outside.out
          [[ $code -ne 0 ]] && grep -q 'вне папки базы знаний' outside.out || fail "a path outside ./kb must be rejected"

          # A query starting with "-" passes through make, scripts/kb.sh and the kb parser (after --).
          make kb-search Q="-5 кг" > search.out 2>&1
          code=$?
          tail -n 3 search.out
          [[ $code -ne 0 ]] && grep -q 'embeddings are not configured' search.out \
            || fail "kb-search without OPENAI_API_KEY must fail on embeddings"
          ! grep -q 'kb: образ .* старше кода' search.out || fail "the image built in this job must not be reported as older than the code"

          # Without postgres scripts/kb.sh stops before docker compose run, with a hint.
          docker compose stop postgres
          make kb-search Q="проверка" > nostack.out 2>&1
          code=$?
          cat nostack.out
          docker compose start postgres
          docker compose up -d --wait --wait-timeout 120 postgres
          [[ $code -ne 0 ]] && grep -q 'стек не поднят' nostack.out || fail "kb without postgres must say the stack is down"

          rm -rf kb/_ci

      # Without keys: environment and stack PASS, LLM, knowledge base, transcription and Telegram SKIP.
      # The script itself exits non-zero on any FAIL; the summary is checked too, so a step that is
      # silently skipped (or one that starts needing a key) is caught here.
      - name: M0 check (no keys)
        shell: bash
        run: |
          make m0-check
          cat m0-results/report.md
          for step in "1. Окружение" "2. Стек"; do
            grep -q "^| ${step}[^|]* | PASS |" m0-results/report.md || { echo "::error::m0-check: ${step} is not PASS"; exit 1; }
          done
          for step in "3. LLM" "4. База знаний" "5. Транскрипция" "6. Telegram"; do
            grep -q "^| ${step}[^|]* | SKIP |" m0-results/report.md || { echo "::error::m0-check: ${step} is not SKIP"; exit 1; }
          done

      - name: Show logs
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v

  media-image:
    needs: tidy
    if: needs.tidy.outputs.committed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build media image
        run: docker build --target media -t ai-agents-media:ci .

      - name: Check ffmpeg, transcribe, roughcut and subtitles
        # sed reads all the output (unlike head), so ffmpeg does not die with a broken pipe.
        run: |
          docker run --rm --entrypoint ffmpeg ai-agents-media:ci -hide_banner -version | sed -n 1p
          docker run --rm --entrypoint sh ai-agents-media:ci -c 'ffmpeg -hide_banner -filters | grep -E " ass "'
          # The HDR tone mapping of the editor (zimg) is in the image's ffmpeg.
          docker run --rm --entrypoint sh ai-agents-media:ci -c 'ffmpeg -hide_banner -filters > /tmp/f && grep -E " zscale " /tmp/f && grep -E " tonemap " /tmp/f'
          docker run --rm --entrypoint /app/subtitles ai-agents-media:ci -h
          docker run --rm --entrypoint ls ai-agents-media:ci -l /app/fonts
          docker run --rm --entrypoint ffprobe ai-agents-media:ci -hide_banner -version | sed -n 1p
          docker run --rm ai-agents-media:ci -h
          docker run --rm --entrypoint /app/roughcut ai-agents-media:ci -h
          docker run --rm --entrypoint id ai-agents-media:ci
          docker run --rm --entrypoint sh ai-agents-media:ci -c 'pwd && touch probe && echo "workdir is writable"'
          # Without a heartbeat the worker is unhealthy (the compose healthcheck).
          if docker run --rm -e MEDIA_WORKER_DIR=/work --entrypoint /app/media-worker ai-agents-media:ci healthcheck; then
            echo "::error::media-worker healthcheck must fail without a heartbeat"; exit 1
          fi

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # The ffmpeg runner tests (silencedetect parsing, cutting, hostile file names) against the
      # ffmpeg of the image, not the runner's: a static test binary runs inside the container.
      - name: Run ffmpeg tests inside the media image
        run: |
          CGO_ENABLED=0 go test -c -o ffmpeg.test ./internal/providers/ffmpeg
          docker run --rm -e FFMPEG_TESTS_REQUIRED=1 -v "$PWD/ffmpeg.test:/app/ffmpeg.test:ro" \
            --entrypoint /app/ffmpeg.test ai-agents-media:ci -test.v -test.count=1 -test.run 'TestRunner'

      # The rough cut render against the ffmpeg of the image: a synthetic clip with tone "words", a broken-off
      # take, a filler and long pauses (duration as planned, no silence longer than 0.4 s), and a variable
      # frame rate clip with delayed audio (sound and picture of every word within a frame of the transcript).
      - name: Run rough cut tests inside the media image
        run: |
          CGO_ENABLED=0 go test -c -o roughcut.test ./internal/roughcut
          docker run --rm -e FFMPEG_TESTS_REQUIRED=1 -v "$PWD/roughcut.test:/app/roughcut.test:ro" \
            --entrypoint /app/roughcut.test ai-agents-media:ci -test.v -test.count=1 -test.run 'TestRender'

      - name: Rough cut a generated clip with the roughcut binary
        # Tone "words" at 0.5-1.0, 1.1-1.6 (a filler), 3.0-3.5 and 3.6-4.2 s; the transcript is given, so no API key
        # is needed. Expected: 3 kept words, ~2.1 s of video, no pause longer than 0.4 s, all output files.
        run: |
          docker run --rm --entrypoint sh ai-agents-media:ci -c '
            set -e
            cd /tmp
            ffmpeg -hide_banner -nostdin -loglevel error -y \
              -f lavfi -i "aevalsrc=if(between(t\,0.5\,1)+between(t\,1.1\,1.6)+between(t\,3\,3.5)+between(t\,3.6\,4.2)\,0.5*sin(2*PI*440*t)\,0):s=48000:d=6" \
              -f lavfi -i "testsrc=duration=6:size=360x640:rate=30" -c:v mpeg4 -c:a aac -shortest clip.mp4
            printf "%s" "{\"language\":\"ru\",\"duration\":6,\"text\":\"\",\"segments\":[],\"words\":[
              {\"word\":\"привет\",\"start\":0.5,\"end\":1},{\"word\":\"эээ\",\"start\":1.1,\"end\":1.6},
              {\"word\":\"это\",\"start\":3,\"end\":3.5},{\"word\":\"тест\",\"start\":3.6,\"end\":4.2}]}" > t.json
            /app/roughcut -in clip.mp4 -transcript t.json -out plan -plan-only
            test ! -e plan/roughcut.mp4
            /app/roughcut -in clip.mp4 -transcript t.json -out cut
            ls -l cut
            cat cut/decisions.log
            test -s cut/plan.json && test -s cut/transcript.json && test -s cut/decisions.log
            ffprobe -v error -show_entries stream=codec_name,width,height -of csv=p=0 cut/roughcut.mp4 | tee streams.txt
            grep -qx "h264,360,640" streams.txt && grep -qx "aac" streams.txt
            d=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 cut/roughcut.mp4)
            echo "duration: $d"
            awk -v d="$d" "BEGIN { exit !(d > 1.9 && d < 2.3) }"
            ffmpeg -hide_banner -nostdin -i cut/roughcut.mp4 -af silencedetect=noise=-30dB:d=0.4 -f null - 2>&1 \
              | tee silence.txt | grep silence_ && { echo "pause longer than 0.4 s"; exit 1; }
            echo "rough cut OK"
          '

      # Rotation tag (1920x1080 + 90° -> 1080x1920) and a video without sound (refused). Then load: a 1080x1920,
      # 120 s clip cut into 60 fragments; the container's cgroup memory.peak (roughcut + ffmpeg) must stay under
      # 800 MiB. The clip is made in a separate run; the cut runs under a 3 GiB container limit, so a regression
      # shows as a measured number rather than a bare OOM kill.
      - name: Rough cut rotation, no audio and memory under load
        run: |
          data="$RUNNER_TEMP/roughcut-data"
          mkdir -p "$data" && chmod 777 "$data"
          run_check() {
            mode=$1; shift
            docker run --rm "$@" -v "$PWD/scripts:/scripts:ro" -v "$data:/data" \
              --entrypoint sh ai-agents-media:ci /scripts/roughcut-image-check.sh "$mode" /data
          }
          run_check basic
          run_check prepare
          run_check load --memory=3g --memory-swap=3g

      # Subtitle rendering against the ffmpeg/libass of the image and the fonts in /app/fonts (SUBTITLES_FONTS_DIR):
      # 1080x1920 output, H.264 + AAC, text outside the Instagram zones, no font fallback; the hook title (T3.15b).
      - name: Run subtitle render tests inside the media image
        run: |
          CGO_ENABLED=0 go test -c -o subtitles.test ./internal/subtitles
          docker run --rm -e FFMPEG_TESTS_REQUIRED=1 -v "$PWD/subtitles.test:/app/subtitles.test:ro" \
            --entrypoint /app/subtitles.test ai-agents-media:ci -test.v -test.count=1 -test.run 'TestBurnSubtitlesWithFFmpeg|TestBurnHookWithFFmpeg'

      # Render speed of a draft (T3.11): a vertical 4K 60 fps 10-bit HEVC HLG source with grain, rough cut into several
      # fragments with subtitles in one pass, on 2 CPUs as the VPS has. The log line "render speed" is the measurement.
      - name: Measure the render speed inside the media image (2 CPUs)
        run: |
          docker run --rm --cpus=2 -e FFMPEG_TESTS_REQUIRED=1 -e RENDER_BENCH=1 \
            -v "$PWD/subtitles.test:/app/subtitles.test:ro" --entrypoint /app/subtitles.test ai-agents-media:ci \
            -test.v -test.count=1 -test.timeout=40m -test.run 'TestRenderSpeed' | tee bench.txt
          grep -q -- '--- PASS: TestRenderSpeed ' bench.txt || { echo "::error::TestRenderSpeed did not pass"; exit 1; }
          grep -E 'render speed|workout estimate' bench.txt | sed 's/^ *//' >> "$GITHUB_STEP_SUMMARY"

      # The editor's pipeline end to end (download → probe → rough cut → subtitles and export in one pass → upload) with
      # the ffmpeg, libass and fonts of the image; the speech recognition and S3 are faked. Checks the Instagram export,
      # the workout plan with the exercise title (the Title style on its box), the muted reel, a dense talk and the hook
      # title (TestIntegrationHookRender: TestIntegrationHookTitle needs Redis and S3, it runs in compose-smoke).
      - name: Run the media worker pipeline inside the media image
        run: |
          CGO_ENABLED=0 go test -c -o mediaworker.test ./internal/mediaworker
          docker run --rm -e INTEGRATION=1 -v "$PWD/mediaworker.test:/app/mediaworker.test:ro" \
            --entrypoint /app/mediaworker.test ai-agents-media:ci -test.v -test.count=1 \
            -test.run 'TestIntegrationPipeline|TestIntegrationWorkout|TestIntegrationNoSpeech|TestIntegrationTalkRendersAtOnce|TestIntegrationHookRender' \
            | tee pipeline.txt
          for test in TestIntegrationPipeline TestIntegrationWorkoutKeepsPauses TestIntegrationNoSpeechIsPlanned \
            TestIntegrationTalkRendersAtOnce TestIntegrationHookRender; do
            grep -q -- "--- PASS: $test " pipeline.txt || { echo "::error::$test did not pass"; exit 1; }
          done
          if grep -q -- '--- SKIP' pipeline.txt; then echo "::error::the pipeline test was skipped"; exit 1; fi

      - name: Burn subtitles into a generated clip with the CLI
        run: |
          docker run --rm --entrypoint sh ai-agents-media:ci -c '
            set -e
            ffmpeg -hide_banner -nostdin -loglevel error -y \
              -f lavfi -i "sine=frequency=440:duration=3" \
              -f lavfi -i "testsrc2=duration=3:size=720x1280:rate=25" \
              -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/clip.mp4
            cat > /tmp/result.json <<JSON
          {"language":"ru","duration":3,"text":"Делаем 3 подхода по 10 повторений!",
           "segments":[{"start":0.2,"end":2.6,"text":"Делаем 3 подхода по 10 повторений!"}],
           "words":[{"word":"Делаем","start":0.2,"end":0.6},{"word":"3","start":0.7,"end":0.9},
                    {"word":"подхода","start":0.9,"end":1.4},{"word":"по","start":1.5,"end":1.6},
                    {"word":"10","start":1.6,"end":1.9},{"word":"повторений","start":1.9,"end":2.6}]}
          JSON
            /app/subtitles -transcript /tmp/result.json -out /tmp/subtitles.ass -ass-only
            grep -q "PlayResY: 1920" /tmp/subtitles.ass
            grep -q "ПОДХОДА" /tmp/subtitles.ass
            /app/subtitles -in /tmp/clip.mp4 -transcript /tmp/result.json -out /tmp/reel.mp4 -karaoke
            ffprobe -v error -show_entries stream=codec_type,codec_name,width,height -of csv=p=0 /tmp/reel.mp4
          ' > subtitles.txt 2>&1 || { cat subtitles.txt; exit 1; }
          cat subtitles.txt
          grep -q '^h264,video,1080,1920$' subtitles.txt
          grep -q '^aac,audio$' subtitles.txt
          grep -q '"subtitles: video rendered"' subtitles.txt
          if grep -q 'brand font not found' subtitles.txt; then
            echo "::error::libass did not use the brand fonts"
            exit 1
          fi

      - name: Extract audio from a generated clip
        # Without OPENAI_API_KEY transcribe stops before the audio is prepared: the key error comes first.
        # With a fake key and an unreachable API it extracts and probes the audio, then fails on the call.
        run: |
          set +e
          docker run --rm -e OPENAI_API_KEY=sk-fake -e OPENAI_BASE_URL=http://127.0.0.1:9/v1 \
            -e WHISPER_MAX_RETRIES=0 --entrypoint sh ai-agents-media:ci -c '
            ffmpeg -hide_banner -nostdin -loglevel error -y \
              -f lavfi -i "sine=frequency=440:duration=3" \
              -f lavfi -i "testsrc=duration=3:size=320x240:rate=25" \
              -c:v mpeg4 -c:a aac -shortest /tmp/clip.mp4 &&
            /app/transcribe -in /tmp/clip.mp4
          ' > out.txt 2>&1
          code=$?
          set -e
          cat out.txt
          if [[ $code -ne 1 ]] || ! grep -q '"transcription: audio prepared"' out.txt \
            || ! grep -q 'connection refused' out.txt; then
            echo "::error::expected audio extraction to succeed and the API call to fail (exit $code)"
            exit 1
          fi

          docker run --rm ai-agents-media:ci -in /tmp/none.mp4 > nokey.txt 2>&1 || true
          cat nokey.txt
          grep -q 'openai api key is not configured' nokey.txt
