name: Tidy

# Runs `go mod tidy` on feature branches and commits go.mod/go.sum back to the branch.
# Needed because some development environments cannot reach the Go module proxy.
# Commits made with GITHUB_TOKEN do not trigger new workflow runs, so this cannot loop;
# the actor check is an extra safeguard.

on:
  push:
    branches: ["feature/**"]

permissions:
  contents: write

concurrency:
  group: tidy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go mod tidy
        run: go mod tidy

      - name: Commit changes
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "go.mod and go.sum are tidy"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "Run go mod tidy"
          git push origin "HEAD:${GITHUB_REF_NAME}"
